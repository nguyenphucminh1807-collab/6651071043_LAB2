<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Wireframe JobFinder – trang danh sách và trang chi tiết</title>
  <rect width="1000" height="1180" fill="#F8FAFC"/>
  <g fill="#fff" stroke="#94A3B8" stroke-width="1.5">
    <rect x="20" y="20" width="620" height="1140" rx="8"/>
    <rect x="660" y="20" width="320" height="1140" rx="8"/>
  </g>
  <text x="40" y="52" font-weight="700" fill="#0F172A">Trang danh sách  /</text>
  <text x="680" y="52" font-weight="700" fill="#0F172A">Trang chi tiết  /item/:id</text>
  <!-- header -->
  <rect x="40" y="70" width="580" height="40" fill="#D1FAE5" stroke="#059669"/><text x="50" y="95" fill="#065F46">Logo · Trang chủ · Tìm việc · Thống kê · Giới thiệu · [Đăng nhập] [Đăng ký]</text>
  <!-- hero -->
  <rect x="40" y="125" width="580" height="200" fill="#ECFDF5" stroke="#059669"/>
  <text x="55" y="155" font-weight="700" fill="#0F172A">H1: Tìm công việc phù hợp – Kiến tạo tương lai của bạn</text>
  <rect x="55" y="175" width="360" height="40" fill="#fff" stroke="#64748B"/><text x="62" y="200" fill="#475569">[ Vị trí / công ty ] [ Địa điểm ▾ ] [Tìm kiếm]</text>
  <text x="55" y="250" fill="#475569">33 việc làm · 31 doanh nghiệp · 10 ngành</text>
  <rect x="440" y="150" width="160" height="150" fill="#fff" stroke="#A7F3D0"/><text x="470" y="230" fill="#475569">Minh họa SVG</text>
  <!-- filter -->
  <rect x="40" y="340" width="580" height="110" fill="#fff" stroke="#059669"/>
  <text x="55" y="365" font-weight="700" fill="#065F46">TÍNH NĂNG 2 – Bộ lọc</text>
  <text x="55" y="392" fill="#475569">Ngành ▾   Lương: [Từ] – [Đến] (preset)   Ngày: [Từ ngày] [Đến ngày]</text>
  <text x="55" y="425" fill="#475569">[Xóa bộ lọc]  [Áp dụng bộ lọc]   chip: Lương từ 30 triệu ✕</text>
  <!-- cards -->
  <g fill="#fff" stroke="#94A3B8">
    <rect x="40" y="465" width="136" height="150"/><rect x="186" y="465" width="136" height="150"/><rect x="332" y="465" width="136" height="150"/><rect x="478" y="465" width="136" height="150"/>
    <rect x="40" y="625" width="136" height="150"/><rect x="186" y="625" width="136" height="150"/><rect x="332" y="625" width="136" height="150"/><rect x="478" y="625" width="136" height="150"/>
  </g>
  <text x="50" y="490" fill="#475569">Job card (≥1025px: 3–4 cột; 640–1024px: 2 cột; &lt;640px: 1 cột)</text>
  <!-- charts -->
  <rect x="40" y="800" width="580" height="340" fill="#ECFDF5" stroke="#059669"/>
  <text x="55" y="825" font-weight="700" fill="#065F46">TÍNH NĂNG 1 – Thống kê</text>
  <text x="55" y="850" fill="#475569">KPI ×4</text>
  <rect x="55" y="865" width="270" height="120" fill="#fff" stroke="#94A3B8"/><text x="65" y="930" fill="#475569">Cột: theo ngành</text>
  <rect x="335" y="865" width="270" height="120" fill="#fff" stroke="#94A3B8"/><text x="345" y="930" fill="#475569">Tròn: tỷ lệ ngành</text>
  <rect x="55" y="995" width="270" height="130" fill="#fff" stroke="#94A3B8"/><text x="65" y="1060" fill="#475569">Cột: phân bố lương</text>
  <rect x="335" y="995" width="270" height="130" fill="#fff" stroke="#94A3B8"/><text x="345" y="1060" fill="#475569">Cột: theo địa điểm</text>
  <!-- detail -->
  <rect x="680" y="70" width="280" height="40" fill="#D1FAE5" stroke="#059669"/><text x="690" y="95" fill="#065F46">Header</text>
  <text x="680" y="140" fill="#047857">← Quay lại danh sách</text>
  <rect x="680" y="155" width="280" height="100" fill="#fff" stroke="#94A3B8"/><text x="690" y="185" fill="#475569">Logo · Tên việc · Công ty</text><text x="690" y="210" fill="#475569">Lương · [Ứng tuyển ngay]</text>
  <rect x="680" y="270" width="280" height="80" fill="#F1F5F9" stroke="#94A3B8"/><text x="690" y="300" fill="#475569">Địa điểm · Hình thức · Kinh nghiệm</text><text x="690" y="325" fill="#475569">Ngày đăng · Hạn nộp · Ngành</text>
  <text x="680" y="385" fill="#475569">Mô tả công việc</text><text x="680" y="410" fill="#475569">Yêu cầu ứng viên</text><text x="680" y="435" fill="#475569">Quyền lợi</text><text x="680" y="460" fill="#475569">Kỹ năng (tag)</text>
  <rect x="680" y="480" width="280" height="110" fill="#ECFDF5" stroke="#059669"/><text x="690" y="510" fill="#065F46">Form ứng tuyển (họ tên, email – validate)</text>
  <rect x="680" y="640" width="280" height="90" fill="#fff" stroke="#059669" stroke-dasharray="6 4"/><text x="690" y="670" font-weight="700" fill="#065F46">TÍNH NĂNG 3</text><text x="690" y="695" fill="#475569">Fade-in + translateY khi đổi route</text>
</svg>
